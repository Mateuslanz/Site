<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>DESAFIO</h1>
        <h3>fazer um formulario</h3>
    </header>

    <section>

    <form id="form" name="form">

    <label for="nome">Nome Completo:</label> <br>
    <input type="text" name="texto" id="text" required>
    <br>
    <label for="email">E-mail:</label><br>
    <input type="email" name="email" id="email" required>
    <br>
    <label for="idade">Idade:</label><br>
    <input type="date" name="idade" id="idade" required>
    <br>
    <label for="assunto">Assunto:</label><br>
    <select name="assunto" id="assunto">
    <option value="assunto">bla</option>
    <option value="assunto">blabla</option>
    <option value="assunto">blablabla</option>
    </select>
    <br>
    <br>
    <label for="turnos">Turnos disponíveis:</label><br>
    <input type="checkbox" name="turnos" id="turnos-matutino">
    <label for="turnos">Turno Matutino</label><br>
    <input type="checkbox" name="turnos" id="turnos-vespertino">
    <label for="turnos">Turno Vespertino</label><br>
    <input type="checkbox" name="turnos" id="turnos-noturno">
    <label for="turnos">Turno Noturno</label><br>
    <br>
    <br>
    <label for="materia">Para qual matéria você está se candidatando?</label><br>
    <input type="radio" name="materia" id="materia-matematica">
    <label for="materia">Matemática</label><br>
    <input type="radio" name="materia" id="materia-portugues">
    <label for="materia">Português</label><br>
    <input type="radio" name="materia" id="materia-biologia">
    <label for="materia">Biologia</label><br>
    <input type="radio" name="materia" id="materia-ciencias">
    <label for="materia">Ciências</label><br>
    <input type="radio" name="materia" id="materia-historia">
    <label for="materia">História</label><br>
    <input type="radio" name="materia" id="materia-geografia">
    <label for="materia">Geografia</label><br>
    <input type="radio" name="materia" id="materia-artes">
    <label for="materia">Artes</label>
    <br>
    <br>
    <label for="escolaridade">Qual seu nível de escolaridade?</label><br>
    <input type="checkbox" name="escolaridade" id="escolaridade-superior-completo">
    <label for="escolaridade">Ensino superior completo</label><br>
    <input type="checkbox" name="escolaridade" id="escolaridade-mestrado-cursando->
    <label for="escolaridade">Cursando mestrado</label><br>
    <input type="checkbox" name="escolaridade" id="escolaridade-mestrado-completo">
    <label for="escolaridade">Mestrado completo</label><br>
    <input type="checkbox" name="escolaridade" id="escolaridade-doutorado-cursando">
    <label for="escolaridade">Cursando doutorado</label><br>
    <input type="checkbox" name="escolaridade" id="escolaridade-doutorado-completo">
    <label for="escolaridade">Doutorado completo</label>
    <br>
    <br>
    <label for="descricao">Descricao sobre si:</label><br>
    <textarea name="descricao" id="descricao" cols="30" rows="10" maxlength="200" ></textarea>
    <br>
    <br>
    <input type="submit" value="Enviar formulário">

    </form>

    </section>

</body>
</html>
